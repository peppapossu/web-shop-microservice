databaseChangeLog:
  - changeSet:
      id: 000-create-table-inbox
      author: ks

      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: inbox

      changes:
        - createTable:
            tableName: inbox
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
