server:
  port: ${SERVER_PORT}

spring:
  profiles:
    active: dev

  # DataBase
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${POSTGRES_NOT_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS_EXTERNAL}
    consumer:
      group-id: order-id
      auto-offset-reset: latest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.ByteArrayDeserializer
#        schema.registry.url: ${SCHEMA_REGISTRY}
#        specific.avro.reader: true
    listener:
      ack-mode: manual

  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-master.yml


---
spring:
  config:
    activate:
      on-profile: dev
    import: "classpath:/config/dev.yml"