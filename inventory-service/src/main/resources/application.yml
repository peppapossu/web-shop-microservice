grpc:
  server:
    port: ${GRPC_SERVER_PORT}

server:
  port: ${SERVER_PORT}

spring:
  application:
    name: inventory-service

  profiles:
    active: dev

  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-master.yml
    default-schema: inventory
    liquibase-schema: public


  # DataBase
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${POSTGRES_INV_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        hbm2ddl:
          auto: validate
        default_schema: inventory

---
spring:
  config:
    activate:
      on-profile: dev
    import: "classpath:/config/dev.yaml"

