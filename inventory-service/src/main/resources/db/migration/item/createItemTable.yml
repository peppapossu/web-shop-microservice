databaseChangeLog:
  - changeSet:
      id: create-item-table
      author: ks

      preConditions:

        onFail: MARK_RAN
        onError: HALT

        not:
          tableExists:
            tableName: item


      changes:
        - createTable:
            tableName: item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: discount
                  type: INT
