server:
  port: ${SERVER_PORT}

spring:
  application:
    name: order-service

  profiles:
    active: dev

  # DataBase
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${POSTGRES_ORD_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}


  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        default_schema: orders
        hbm2ddl:
          auto: validate
    open-in-view: false


  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PUBLIC_KEY_URL}

  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-master.yml
    default-schema: orders
    liquibase-schema: public

  mvc:
    problemdetails:
      enabled: true

grpc:
  client:
    inventory-service:
      address: ${GRPC_SERVER}
      negotiationType: plaintext

# Protection for gRPC client
resilience4j:
  retry:
    instances:
      inventory:
        maxAttempts: 3
        waitDuration: 200ms
        randomized-wait-factor: 0.5
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

  circuitbreaker:
    instances:
      inventory:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slidingWindowSize: 10
        waitDurationInOpenState: 10s
        minimum-number-of-calls: 5

