databaseChangeLog:
  - changeSet:
      id: create-outbox-event-table
      author: ks
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: outbox_event

      changes:
        - createTable:
            tableName: outbox_event
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: aggregate_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createIndex:
            tableName: outbox_event
            indexName: idx_outbox_aggregate_id
            columns:
              - column:
                  name: aggregate_id

        - createIndex:
            tableName: outbox_event
            indexName: idx_outbox_created_at
            columns:
              - column:
                  name: created_at
